@font-face{
  font-family:"Bricolage Grotesque";
  src:url("/fonts/bricolage-grotesque.woff2") format("woff2-variations"),
      url("/fonts/bricolage-grotesque.woff2") format("woff2");
  font-weight:200 800;
  font-stretch:75% 100%;
  font-display:swap;
}
:root{
  --orange:#ff6a45;
  --ink:#353535;
  --paper:#ffffff;
  --muted:#5f5f5f;
  --tint:#fff0eb;
  --on-orange:#353535;

  /* pulse geometry: mark viewBox is 176 x 174, stroke is 20 units */
  --m:clamp(118px, 15vw, 200px);
  --h:calc(var(--m) * 0.98864);
  --t:calc(var(--m) * 0.11364);

  --gutter:clamp(1.25rem, 5vw, 4.5rem);
  --ease:cubic-bezier(.65,0,.35,1);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#f5f2f0;
    --paper:#353535;
    --muted:#c9c4c1;
    --tint:#403b39;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-optical-sizing:auto;
  font-size:1.0625rem;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
.page{
  min-height:100%;
  display:grid;
  grid-template-rows:auto 1fr auto;
}

/* ---------- Header ---------- */
.top{
  padding:clamp(1.25rem, 3vw, 2rem) var(--gutter) 0;
}
.brand{display:inline-block;line-height:0;border-radius:6px;color:var(--ink)}
.brand svg{width:clamp(132px, 16vw, 176px);height:auto;display:block}
.brand .ink{fill:currentColor}
.brand .accent{fill:var(--orange)}

/* ---------- Main ---------- */
main{
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding-block:clamp(2.5rem, 7vh, 5rem);
}
.intro{padding-inline:var(--gutter)}
h1{
  margin:0;
  font-size:clamp(3.6rem, 14vw, 12rem);
  font-weight:700;
  font-stretch:90%;
  letter-spacing:-.02em;
  line-height:.88;
}
.lede{
  margin:clamp(1rem, 2.4vw, 1.6rem) 0 0;
  max-width:36ch;
  font-size:clamp(1.0625rem, 1.5vw, 1.25rem);
  color:var(--muted);
}

/* ---------- The pulse line (logo mark on an endless line) ---------- */
.pulse{
  position:relative;
  height:var(--h);
  margin-block:clamp(1.75rem, 5vh, 3.25rem);
  display:grid;
  grid-template-columns:1fr var(--m) 1fr;
}
.pulse .line{
  position:relative;
  height:var(--t);
  background:var(--orange);
  transform-origin:left center;
  overflow:hidden;
}
.pulse .line.l{top:calc(var(--h) * .5747 - var(--t) / 2);margin-right:-1px}
.pulse .line.r{top:calc(var(--h) * .4253 - var(--t) / 2);margin-left:-1px}
.pulse .mark{width:var(--m);height:var(--h);display:block;position:relative;z-index:1}
.pulse .mark path{fill:var(--orange)}

.pulse .sheen::before{
  content:"";
  position:absolute;top:0;bottom:0;left:0;
  width:26%;
  background:linear-gradient(90deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,.10) 22%,
    rgba(255,255,255,.55) 50%,
    rgba(255,255,255,.10) 78%,
    rgba(255,255,255,0) 100%);
  transform:translateX(-100%);
  will-change:transform;
}

/* ---------- Next steps ---------- */
.next{
  padding-inline:var(--gutter);
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:1rem 1.75rem;
}
.btn{
  display:inline-flex;
  align-items:center;
  gap:.6rem;
  padding:.95rem 1.5rem;
  border-radius:999px;
  background:var(--orange);
  color:var(--on-orange);
  font-size:1.1875rem;
  font-weight:700;
  text-decoration:none;
  line-height:1.1;
  box-shadow:0 10px 30px -12px rgba(255,106,69,.7);
  transition:transform .2s ease, box-shadow .2s ease, background-color .2s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 36px -14px rgba(255,106,69,.85)}
.btn:active{transform:translateY(0)}
.btn .dot{
  width:.55rem;height:.55rem;border-radius:50%;
  background:var(--on-orange);
  box-shadow:0 0 0 0 rgba(53,53,53,.45);
}
.follow{margin:0;color:var(--muted)}
.follow a{
  color:var(--ink);
  font-weight:600;
  text-decoration:underline;
  text-decoration-color:var(--orange);
  text-decoration-thickness:2px;
  text-underline-offset:.25em;
  transition:text-decoration-thickness .15s ease, color .15s ease;
}
.follow a:hover{text-decoration-thickness:4px}

/* ---------- Footer ---------- */
.foot{
  padding:1.25rem var(--gutter) clamp(1.25rem, 3vw, 2rem);
  display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem 1.5rem;
  font-size:.9375rem;
  color:var(--muted);
}
.foot a{color:inherit;text-decoration:none}
.foot a:hover{color:var(--ink);text-decoration:underline;text-decoration-color:var(--orange);text-underline-offset:.2em}

a:focus-visible{outline:3px solid var(--orange);outline-offset:4px;border-radius:6px}
.btn:focus-visible{outline-color:var(--ink);border-radius:999px}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Load sequence ---------- */
@media (prefers-reduced-motion: no-preference){
  .brand, h1, .lede, .next, .foot{animation:rise .8s var(--ease) both}
  .brand{animation-delay:.05s}
  h1{animation-delay:.15s}
  .lede{animation-delay:.3s}
  .pulse .line.l{animation:draw .9s var(--ease) .35s both}
  .pulse .mark{animation:write .75s cubic-bezier(.45,0,.25,1) 1.2s both}
  .pulse .line.r{animation:draw 1s var(--ease) 1.9s both}
  .next{animation-delay:2.35s}
  .foot{animation-delay:2.5s}
  .pulse .sheen{display:block}
  .pulse .sheen::before{animation:sheen 5.2s linear 3.2s infinite}
  .btn .dot{animation:ping 2.4s ease-out 3s infinite}

  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes write{from{clip-path:inset(-2px 100% -2px 0)}to{clip-path:inset(-2px 0 -2px 0)}}
  @keyframes sheen{
    0%{transform:translateX(-100%)}
    46%,100%{transform:translateX(385%)}
  }
  @keyframes ping{
    0%{box-shadow:0 0 0 0 rgba(53,53,53,.45)}
    70%,100%{box-shadow:0 0 0 .55rem rgba(53,53,53,0)}
  }
}

@media (max-width: 560px){
  .next{flex-direction:column;align-items:flex-start}
  .btn{width:100%;justify-content:center}
  .foot{flex-direction:column}
}
